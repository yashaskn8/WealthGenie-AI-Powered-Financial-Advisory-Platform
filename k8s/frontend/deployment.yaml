apiVersion: apps/v1
kind: Deployment
metadata:
  name: wealthgenie-frontend
  namespace: wealthgenie
  labels:
    app: wealthgenie-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wealthgenie-frontend
  template:
    metadata:
      labels:
        app: wealthgenie-frontend
    spec:
      containers:
        - name: frontend
          image: wealthgenie-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3