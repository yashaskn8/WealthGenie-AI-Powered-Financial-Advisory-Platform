apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wealthgenie-server-hpa
  namespace: wealthgenie
  labels:
    app: wealthgenie-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wealthgenie-server
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
