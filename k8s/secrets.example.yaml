apiVersion: v1
kind: Secret
metadata:
  name: wealthgenie-secrets
  namespace: wealthgenie
  labels:
    app.kubernetes.io/name: wealthgenie
type: Opaque
# NOTE: In production or CI, populate these using sealed-secrets, Vault, or:
# kubectl create secret generic wealthgenie-secrets -n wealthgenie \
#   --from-literal=JWT_SECRET="your-32-char-min-jwt-secret" \
#   --from-literal=GEMINI_API_KEY="your-gemini-api-key" \
#   --from-literal=ML_SERVICE_API_KEY="your-ml-service-api-key" \
#   --from-literal=MONGODB_URI="mongodb://wealthgenie-mongodb.wealthgenie.svc.cluster.local:27017/wealthgenie"
stringData:
  JWT_SECRET: "ci-dev-jwt-secret-key-minimum-32-chars-length"
  GEMINI_API_KEY: "mock-or-production-gemini-api-key"
  ML_SERVICE_API_KEY: "mock-or-production-ml-service-api-key"
  MONGODB_URI: "mongodb://wealthgenie-mongodb.wealthgenie.svc.cluster.local:27017/wealthgenie"
