apiVersion: v1
kind: Service
metadata:
  name: wealthgenie-mongodb
  namespace: wealthgenie
  labels:
    app: wealthgenie-mongodb
spec:
  type: ClusterIP
  # Replica-set initialization must be able to reach the first member before
  # its readiness probe can report a PRIMARY. Without this, Service endpoint
  # publication and replica-set readiness deadlock each other.
  publishNotReadyAddresses: true
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
  selector:
    app: wealthgenie-mongodb
