version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: wealthgenie-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: wealthgenie-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wealthgenie-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/wealthgenie
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  reactapp:
    build:
      context: ./reactapp
      dockerfile: Dockerfile
    container_name: wealthgenie-reactapp
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: wealthgenie-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
      - ML_OPERATOR_KEY=${ML_OPERATOR_KEY:-}
      - MONGODB_URI=mongodb://mongodb:27017/wealthgenie
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
