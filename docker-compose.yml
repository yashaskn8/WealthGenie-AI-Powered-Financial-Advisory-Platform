# WealthGenie — Containerized Horizontal Scaling Stack
#
# Brings up:
#   - MongoDB 7.0 (real database)
#   - Redis 7 Alpine (real Redis, NOT redis-emulator.js)
#   - Two Express app instances (app1, app2) built from server/Dockerfile
#   - NGINX load balancer doing real round-robin
#
# Usage:
#   docker compose up --build -d
#   node server/scripts/benchmark-containerized.js
#   docker compose down

services:
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app1:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: "5000"
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/wealthgenie
      REDIS_URL: redis://redis:6379
      JWT_SECRET: containerized-bench-jwt-secret-2026
      DISABLE_RATE_LIMIT: "true"
      DISABLE_HTTP_LOGGING: "true"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  app2:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: "5000"
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/wealthgenie
      REDIS_URL: redis://redis:6379
      JWT_SECRET: containerized-bench-jwt-secret-2026
      DISABLE_RATE_LIMIT: "true"
      DISABLE_HTTP_LOGGING: "true"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy

volumes:
  mongo_data:
