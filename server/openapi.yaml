openapi: 3.1.0
info:
  title: WealthGenie Public API
  version: 2.0.0
  description: Canonical contract for the supported public Express API. Internal metrics and MCP routes are intentionally excluded.
servers:
  - { url: 'http://localhost:5000', description: Local development }
  - { url: '/', description: Same-origin production gateway }

paths:
  /api/auth/register:
    post:
      operationId: registerUser
      tags: [Authentication]
      security: []
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/Register' }
      responses: { '201': { $ref: '#/components/responses/AuthSession' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/auth/login:
    post:
      operationId: loginUser
      tags: [Authentication]
      security: []
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses: { '200': { $ref: '#/components/responses/AuthSession' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/auth/logout:
    post:
      operationId: logoutUser
      tags: [Authentication]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      responses: { '200': { $ref: '#/components/responses/Message' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/auth/session:
    get:
      operationId: restoreSession
      tags: [Authentication]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/AuthSession' }, '401': { $ref: '#/components/responses/Unauthorized' } }

  /api/profile/build:
    post:
      operationId: buildProfile
      tags: [Profiles]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      x-idempotency-key: optional
      requestBody: { $ref: '#/components/requestBodies/ProfileCreate' }
      responses: { '201': { $ref: '#/components/responses/Profile' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/profile/current:
    get:
      operationId: getCurrentProfile
      tags: [Profiles]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Profile' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/profile/{profileId}:
    put:
      operationId: updateProfile
      tags: [Profiles]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      requestBody: { $ref: '#/components/requestBodies/ProfileUpdate' }
      responses: { '200': { $ref: '#/components/responses/Profile' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/recommend:
    post:
      operationId: createRecommendation
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      x-idempotency-key: required
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Recommendation' }
      responses: { '200': { $ref: '#/components/responses/Recommendation' }, '201': { $ref: '#/components/responses/Recommendation' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/recommend/audit:
    get:
      operationId: listRecommendationAudits
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      parameters:
        - { name: profileId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses: { '200': { description: Owned audit records, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditMetadata' } } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/recommend/audit/verify:
    get:
      operationId: verifyRecommendationAuditChain
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses: { '200': { description: Tamper-evident chain status, content: { application/json: { schema: { $ref: '#/components/schemas/AuditVerification' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/recommend/audit/{id}:
    get:
      operationId: getRecommendationAudit
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Owned audit record, content: { application/json: { schema: { $ref: '#/components/schemas/AuditMetadata' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/recommend/weights:
    post:
      operationId: updateRecommendationWeights
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/RecommendationWeights' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }

  /api/goals/create:
    post:
      operationId: createGoal
      tags: [Goals]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      x-idempotency-key: optional
      requestBody: { $ref: '#/components/requestBodies/GoalCreate' }
      responses: { '201': { $ref: '#/components/responses/Goal' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/goals:
    get:
      operationId: listGoals
      tags: [Goals]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses: { '200': { description: Owned goals, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Goal' } } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/goals/{goalId}/refresh-advice:
    patch:
      operationId: refreshGoalAdvice
      tags: [Goals]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      parameters: [{ $ref: '#/components/parameters/GoalId' }]
      responses: { '200': { $ref: '#/components/responses/Goal' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/goals/{goalId}:
    patch:
      operationId: updateGoal
      tags: [Goals]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      parameters: [{ $ref: '#/components/parameters/GoalId' }]
      requestBody: { $ref: '#/components/requestBodies/GoalUpdate' }
      responses: { '200': { $ref: '#/components/responses/Goal' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      operationId: deleteGoal
      tags: [Goals]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      parameters: [{ $ref: '#/components/parameters/GoalId' }]
      responses: { '200': { $ref: '#/components/responses/Message' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/instruments:
    get:
      operationId: listInstruments
      tags: [Instruments]
      security: []
      responses: { '200': { description: Canonical investment catalog, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Instrument' } } } } } }
  /api/instruments/rank-wti:
    post:
      operationId: rankInstruments
      tags: [Instruments]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/RankInstruments' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }

  /api/projection:
    post:
      operationId: createProjection
      tags: [Projections]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/Projection' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/projection/xirr:
    post:
      operationId: calculateXirr
      tags: [Projections]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/Xirr' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/montecarlo/montecarlo:
    post:
      operationId: runMonteCarlo
      tags: [Projections]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/MonteCarlo' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }

  /api/market/rates:
    get: { operationId: getMarketRates, tags: [Market], security: [], responses: { '200': { $ref: '#/components/responses/Object' } } }
  /api/market/params:
    get: { operationId: getMarketParameters, tags: [Market], security: [], responses: { '200': { $ref: '#/components/responses/Object' } } }
  /api/market/refresh:
    post:
      operationId: refreshMarketData
      tags: [Market]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      responses: { '200': { $ref: '#/components/responses/Object' }, '401': { $ref: '#/components/responses/Unauthorized' } }

  /api/tax/compute:
    get:
      operationId: computeTax
      tags: [Tax]
      security: []
      parameters: [{ $ref: '#/components/parameters/Income' }, { name: regime, in: query, schema: { type: string, enum: [new, old], default: new } }]
      responses: { '200': { $ref: '#/components/responses/TaxCalculation' }, '400': { $ref: '#/components/responses/BadRequest' } }
  /api/tax/compare:
    get:
      operationId: compareTaxRegimes
      tags: [Tax]
      security: []
      parameters: [{ $ref: '#/components/parameters/Income' }]
      responses: { '200': { $ref: '#/components/responses/TaxComparison' }, '400': { $ref: '#/components/responses/BadRequest' } }
  /api/tax/post-tax-return:
    post:
      operationId: calculatePostTaxReturn
      tags: [Tax]
      security: []
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/PostTaxReturn' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' } }
  /api/tax/post-tax-return/batch:
    post:
      operationId: calculatePostTaxReturns
      tags: [Tax]
      security: []
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/PostTaxReturnBatch' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' } }

  /api/portfolio/optimise:
    post:
      operationId: optimisePortfolio
      tags: [Portfolio]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/PortfolioOptimise' }
      responses: { '200': { $ref: '#/components/responses/Portfolio' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/portfolio/rebalance:
    post:
      operationId: rebalancePortfolio
      tags: [Portfolio]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/Rebalance' }
      responses: { '200': { $ref: '#/components/responses/Portfolio' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }

  /api/chat/message:
    post:
      operationId: sendChatMessage
      tags: [Chat]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/Chat' }
      responses: { '200': { $ref: '#/components/responses/Chat' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/chat/history:
    get:
      operationId: getChatHistory
      tags: [Chat]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses: { '200': { description: Current user's history, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/chat/session/{sessionId}:
    delete:
      operationId: deleteChatSession
      tags: [Chat]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string, maxLength: 100 } }]
      responses: { '200': { $ref: '#/components/responses/Message' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/regime/current:
    get: { operationId: getCurrentRegime, tags: [Regime], security: [], parameters: [{ $ref: '#/components/parameters/MacroRegime' }], responses: { '200': { $ref: '#/components/responses/Object' } } }
  /api/regime/tilts:
    get: { operationId: getRegimeTilts, tags: [Regime], security: [], parameters: [{ $ref: '#/components/parameters/MacroRegime' }], responses: { '200': { $ref: '#/components/responses/Object' } } }
  /api/regime/adjust:
    post:
      operationId: adjustAllocationForRegime
      tags: [Regime]
      security: []
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/RegimeAdjust' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' } }

  /health:
    get: { operationId: getHealth, tags: [Health], security: [], responses: { '200': { $ref: '#/components/responses/Health' } } }
  /health/deep:
    get: { operationId: getDeepHealth, tags: [Health], security: [], responses: { '200': { $ref: '#/components/responses/Health' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /health/ready:
    get: { operationId: getReadiness, tags: [Health], security: [], responses: { '200': { $ref: '#/components/responses/Health' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /health/live:
    get: { operationId: getLiveness, tags: [Health], security: [], responses: { '200': { $ref: '#/components/responses/Health' } } }
  /ready:
    get: { operationId: redirectReadiness, tags: [Health], security: [], responses: { '307': { description: Redirect to /health/ready } } }
  /live:
    get: { operationId: redirectLiveness, tags: [Health], security: [], responses: { '307': { description: Redirect to /health/live } } }
  /healthz:
    get: { operationId: getLegacyLiveness, tags: [Health], security: [], responses: { '200': { $ref: '#/components/responses/Health' } } }
  /readyz:
    get: { operationId: redirectLegacyReadiness, tags: [Health], security: [], responses: { '307': { description: Redirect to /health/ready } } }
  /api/health:
    get: { operationId: getApiHealth, tags: [Health], security: [], responses: { '200': { $ref: '#/components/responses/Health' } } }

components:
  securitySchemes:
    CookieAuth: { type: apiKey, in: cookie, name: wg_session, description: Secure HttpOnly browser session cookie. }
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: Explicitly configured non-browser compatibility authentication. }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
    ProfileId: { name: profileId, in: path, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' } }
    GoalId: { name: goalId, in: path, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' } }
    Income: { name: income, in: query, required: true, schema: { type: number, minimum: 0, maximum: 1000000000 } }
    MacroRegime: { name: regime, in: query, schema: { type: string, enum: [normal, geopolitical_conflict, pandemic_health_crisis, broad_market_crash, inflation_spike, rate_cut_cycle] } }
  requestBodies:
    Register: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
    Login: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
    ProfileCreate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialProfileInput' } } } }
    ProfileUpdate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialProfileUpdate' } } } }
    Recommendation: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationRequest' } } } }
    RecommendationWeights: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationWeightsRequest' } } } }
    GoalCreate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GoalCreateRequest' } } } }
    GoalUpdate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GoalUpdateRequest' } } } }
    RankInstruments: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RankInstrumentsRequest' } } } }
    Projection: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectionRequest' } } } }
    Xirr: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/XirrRequest' } } } }
    MonteCarlo: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MonteCarloRequest' } } } }
    PostTaxReturn: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostTaxReturnRequest' } } } }
    PostTaxReturnBatch: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostTaxReturnBatchRequest' } } } }
    PortfolioOptimise: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PortfolioOptimiseRequest' } } } }
    Rebalance: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RebalanceRequest' } } } }
    Chat: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChatRequest' } } } }
    RegimeAdjust: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegimeAdjustRequest' } } } }
  responses:
    Object: { description: Successful structured response, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    Message: { description: Successful operation, content: { application/json: { schema: { type: object, required: [message], properties: { message: { type: string } } } } } }
    AuthSession: { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }
    Profile: { description: Authoritative financial profile, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialProfile' } } } }
    Recommendation: { description: Recommendation and audit identifiers, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationResponse' } } } }
    Goal: { description: Goal state, content: { application/json: { schema: { $ref: '#/components/schemas/Goal' } } } }
    TaxCalculation: { description: Authoritative tax calculation, content: { application/json: { schema: { $ref: '#/components/schemas/TaxCalculation' } } } }
    TaxComparison: { description: Authoritative regime comparison, content: { application/json: { schema: { $ref: '#/components/schemas/TaxComparison' } } } }
    Portfolio: { description: Server-authoritative portfolio decision, content: { application/json: { schema: { $ref: '#/components/schemas/PortfolioResult' } } } }
    Chat: { description: Assistant response, content: { application/json: { schema: { $ref: '#/components/schemas/ChatResponse' } } } }
    Health: { description: Service health, content: { application/json: { schema: { $ref: '#/components/schemas/HealthStatus' } } } }
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Authentication required or invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Request conflicts with current state, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unavailable: { description: Service or dependency unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      required: [error, message, code, request_id]
      properties:
        error: { type: string, description: Backward-compatible summary }
        message: { type: string }
        code: { type: string, pattern: '^[A-Z0-9_]+$' }
        request_id: { type: string }
        details: { oneOf: [{ type: array, items: { type: string } }, { type: object, additionalProperties: true }] }
    User:
      type: object
      required: [id, name, email, role]
      properties: { id: { type: string }, name: { type: string }, email: { type: string, format: email }, mobile: { type: [string, 'null'] }, role: { type: string }, createdAt: { type: string, format: date-time } }
    AuthSession:
      type: object
      required: [csrfToken, user]
      properties:
        csrfToken: { type: string, writeOnly: true }
        user: { $ref: '#/components/schemas/User' }
        token: { type: string, writeOnly: true, description: Development-only compatibility field; never emitted in production. }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties: { name: { type: string, minLength: 2, maxLength: 100 }, email: { type: string, format: email }, password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }, mobile: { type: string, minLength: 10, maxLength: 15 } }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string, minLength: 8, maxLength: 128, writeOnly: true } }
    FinancialProfileInput:
      type: object
      required: [monthly_income, age, monthly_savings, liquid_savings, dependents, emergency_fund_months, risk_tolerance, goal_type]
      properties:
        monthly_income: { type: number, minimum: 1000 }
        age: { type: integer, minimum: 18, maximum: 80 }
        monthly_savings: { type: number, minimum: 500 }
        regime: { type: string, enum: [new, old] }
        investment_horizon: { type: integer, minimum: 1, maximum: 40 }
        liquid_savings: { type: number, minimum: 0 }
        existing_debt: { type: number, minimum: 0 }
        dependents: { type: integer, minimum: 0, maximum: 15 }
        emergency_fund_months: { type: number, minimum: 0, maximum: 120 }
        risk_tolerance: { type: string, enum: [Conservative, Moderate, Aggressive] }
        goal_type: { type: string, enum: [retirement, house purchase, education, wealth-building] }
        total_ctc: { type: number, minimum: 100000 }
        basic_component: { type: number, minimum: 20000 }
        monthly_take_home: { type: number, minimum: 1000 }
        sold_property_amount: { type: number, minimum: 0 }
        has_lump_sum: { type: boolean }
        lump_sum_amount: { type: number, minimum: 0 }
