name: CI Test Matrix & Production Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan-gate:
    name: Secret Scanning Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Run Secret Scanner
        run: node scripts/secret-scanner.js --all

  docs-sync-gate:
    name: Documentation Sync Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Run Docs Sync Checker
        run: node scripts/check_docs_sync.js

  backend-integration-linux:
    name: Backend Linux (Node ${{ matrix.node-version }}, Mongo ${{ matrix.mongodb-version }})
    needs: [secret-scan-gate, docs-sync-gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
        mongodb-version: ['6.0', '7.0']

    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB ${{ matrix.mongodb-version }}
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies (npm ci)
        run: |
          cd server
          npm ci

      - name: Run Backend Tests & Coverage
        env:
          MONGODB_URI: 'mongodb://127.0.0.1:27017/wealthgenie_test'
          JWT_SECRET: 'super-secret-test-key-for-ci-pipeline-2026'
        run: |
          cd server
          npm run test:coverage

      - name: Run Load Test Benchmark
        env:
          DISABLE_RATE_LIMIT: 'true'
          DISABLE_HTTP_LOGGING: 'true'
          MONGODB_URI: 'mongodb://127.0.0.1:27017/wealthgenie_loadtest'
          JWT_SECRET: 'super-secret-test-key-for-ci-pipeline-2026'
        run: |
          cd server
          npm run loadtest

      - name: Upload Backend Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-linux-node${{ matrix.node-version }}-mongo${{ matrix.mongodb-version }}
          path: server/reports/

  backend-unit-windows:
    name: Backend Windows (Node ${{ matrix.node-version }})
    needs: [secret-scan-gate, docs-sync-gate]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies (npm ci)
        run: |
          cd server
          npm ci

      - name: Run Backend Unit Tests & Coverage (No MongoDB Required)
        env:
          JWT_SECRET: 'super-secret-test-key-for-ci-pipeline-2026'
        run: |
          cd server
          npm run test:coverage:unit

      - name: Upload Backend Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-windows-node${{ matrix.node-version }}
          path: server/reports/

  frontend-quality-matrix:
    name: Frontend (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    needs: [secret-scan-gate, docs-sync-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: reactapp/package-lock.json

      - name: Install Frontend Dependencies (npm ci)
        run: |
          cd reactapp
          npm ci

      - name: Run Vitest Suite
        run: |
          cd reactapp
          npm test

  ml-microservice-quality:
    name: ML Service (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: [secret-scan-gate, docs-sync-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Install Requirements
        run: |
          cd ml-service
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          cd ml-service
          pytest
