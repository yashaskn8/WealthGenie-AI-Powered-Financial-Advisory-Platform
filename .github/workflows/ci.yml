name: CI Test Matrix

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration-linux:
    name: Backend Linux (Node ${{ matrix.node-version }}, Mongo ${{ matrix.mongodb-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
        mongodb-version: ['6.0', '7.0']

    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB ${{ matrix.mongodb-version }}
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Run Backend ESLint Check
        run: |
          cd server
          npm run lint

      - name: Run Backend Tests & Coverage
        env:
          MONGODB_URI: 'mongodb://127.0.0.1:27017/wealthgenie_test'
        run: |
          JWT_SECRET="${{ secrets.CI_JWT_SECRET }}"
          if [ -z "$JWT_SECRET" ]; then
            JWT_SECRET=$(openssl rand -hex 32)
          fi
          export JWT_SECRET
          cd server
          npm run test:coverage

      - name: Upload Backend Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-linux-node${{ matrix.node-version }}-mongo${{ matrix.mongodb-version }}
          path: server/reports/

      - name: Audit npm dependencies
        continue-on-error: true
        run: |
          cd server
          echo '## 🔍 npm Audit (backend)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level=high 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  backend-unit-windows:
    name: Backend Windows (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Run Backend ESLint Check
        run: |
          cd server
          npm run lint

      - name: Run Backend Unit Tests & Coverage (No MongoDB Required)
        run: |
          $JWT_SECRET = "${{ secrets.CI_JWT_SECRET }}"
          if (-not $JWT_SECRET) {
            $JWT_SECRET = -join ((48..57) + (97..122) | Get-Random -Count 64 | ForEach-Object { [char]$_ })
          }
          $env:JWT_SECRET = $JWT_SECRET
          cd server
          npm run test:coverage:unit

      - name: Upload Backend Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-windows-node${{ matrix.node-version }}
          path: server/reports/

  frontend-quality-matrix:
    name: Frontend (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: reactapp/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd reactapp
          npm ci

      - name: Run ESLint Check
        run: |
          cd reactapp
          npx eslint src/

      - name: Run Vitest Suite
        run: |
          cd reactapp
          npm test

  ml-microservice-quality:
    name: ML Service (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Install Requirements
        run: |
          cd ml-service
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          cd ml-service
          pytest

      - name: Audit pip dependencies
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          pip install pip-audit
          echo '## 🔍 pip-audit (ml-service)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pip-audit -r ml-service/requirements.txt 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
